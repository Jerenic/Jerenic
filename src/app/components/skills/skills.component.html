<section id="skills" class="py-24 bg-neutral-950">
  <div class="container mx-auto px-4 max-w-6xl">
    <!-- Section heading -->
    <div class="mb-16 text-center">
      <p class="font-mono text-sm text-green-500 mb-3">
        <span class="text-neutral-600">$</span> {{ 'SKILLS.SECTION_LABEL' | translate }}
      </p>
      <h2 class="text-3xl md:text-4xl font-bold text-neutral-100 tracking-tight">
        {{ 'SKILLS.TITLE' | translate }}
      </h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      @for (group of skillGroups; track group.key) {
        <div
          class="group rounded-lg border border-neutral-800 bg-neutral-900/60 p-6 transition-all duration-300 hover:border-neutral-600 hover:bg-neutral-900">
          <h3 class="text-lg font-bold mb-5 text-neutral-100 font-mono">
            {{ 'SKILLS.' + group.key | translate }}
          </h3>
          <div class="flex flex-wrap gap-2">
            @for (skill of group.skills; track skill) {
              <span
                class="rounded border border-neutral-800 bg-neutral-950 px-2.5 py-1 text-xs font-mono text-neutral-400 transition-colors group-hover:border-neutral-700">
                {{ skill }}
              </span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
